name: Release desktop app

# Pushing a vX.Y.Z tag builds the installers on every platform, uploads them with the update
# metadata the app's updater reads to a draft GitHub Release, and publishes the draft once every
# platform has uploaded. The tag must match the app version in apps/desktop/package.json.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      display: ${{ steps.meta.outputs.display }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the app version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match the app version ${VERSION}." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          # Releases are named by the four-part display version; the tag carries the stored semver.
          DISPLAY="$(node --input-type=module -e "const { displayOf } = await import('./scripts/app-version.mjs'); console.log(displayOf(process.argv[1]))" "${VERSION}")"
          echo "display=${DISPLAY}" >> "${GITHUB_OUTPUT}"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.meta.outputs.tag }}" --draft --title "Meridian v${{ steps.meta.outputs.display }}" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Harness build dependencies
        run: python -m pip install -e "apps/harness[build]"

      - name: Install Node dependencies
        run: npm ci

      - name: Build and upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
          # No signing certificate is configured; macOS is signed ad hoc by the builder config.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix apps/desktop run package -- --publish always

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.draft.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
      # Only the newest release feeds the updater, so older ones and their tags are removed beyond the latest ten.
      - name: Keep the newest ten releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt,isDraft \
            --jq 'map(select(.isDraft | not)) | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
