# Undoes milestone changes made by accounts that .github/MILESTONE_MANAGERS does not list.
# GitHub cannot restrict milestones to some of the accounts that can push, so this undoes them after the fact.
name: Milestone guard

on:
  milestone:
    types: [created, edited, opened, closed, deleted]
  issues:
    types: [milestoned, demilestoned]

permissions:
  contents: read
  issues: write

# One issue's or one milestone's events are undone one at a time; each run reads the issue's whole history.
concurrency:
  group: milestone-guard-${{ github.event.issue.number || github.event.milestone.number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs')
            const { guard } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/milestone-guard.mjs`)
            await guard({ github, context, core, managersText: readFileSync('.github/MILESTONE_MANAGERS', 'utf8') })
