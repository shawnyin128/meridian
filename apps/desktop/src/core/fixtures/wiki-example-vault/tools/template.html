<title>Quantization Wiki Pilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --ground:#F2F4F6;--panel:#FFFFFF;--panel-2:#EAEEF2;--ink:#1B2430;--ink-2:#46525F;--muted:#7A8794;--line:#D8DDE3;--line-2:#BFC7D0;
  --gen:#5B6B7A;--gen-soft:#E7EBEF;--append:#8A4F00;--append-soft:#F8E8CF;--store:#0F766E;--store-soft:#D5EFEA;
  --warn:#9C5A05;--warn-soft:#F8E8CF;--err:#B42323;--err-soft:#F8DADA;--info:#46525F;--info-soft:#E7EBEF;
  --k0:#0F766E;--k0-soft:#D5EFEA;--k1:#4338CA;--k1-soft:#E0E2FA;--k2:#9D174D;--k2-soft:#F9DDEA;--k3:#5B21B6;--k3-soft:#E9DDFB;
  --sans:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --serif:"Source Serif 4","Songti SC","Noto Serif CJK SC","SimSun",Georgia,serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --shadow:0 8px 24px rgba(20,30,40,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1317;--panel:#151B21;--panel-2:#1D252D;--ink:#E6EAEE;--ink-2:#B5BEC7;--muted:#7F8B97;--line:#2A343E;--line-2:#3B4753;
  --gen:#9AA8B5;--gen-soft:#1F2A34;--append:#F0B45B;--append-soft:#33270F;--store:#2DD4BF;--store-soft:#123D39;
  --warn:#F0B45B;--warn-soft:#33270F;--err:#F87171;--err-soft:#3F1B1B;--info:#B5BEC7;--info-soft:#1F2A34;
  --k0:#2DD4BF;--k0-soft:#123D39;--k1:#A5B4FC;--k1-soft:#24285A;--k2:#F9A8D4;--k2-soft:#4A1A33;--k3:#C4B5FD;--k3-soft:#33204F;
  --shadow:0 8px 24px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0E1317;--panel:#151B21;--panel-2:#1D252D;--ink:#E6EAEE;--ink-2:#B5BEC7;--muted:#7F8B97;--line:#2A343E;--line-2:#3B4753;
  --gen:#9AA8B5;--gen-soft:#1F2A34;--append:#F0B45B;--append-soft:#33270F;--store:#2DD4BF;--store-soft:#123D39;
  --warn:#F0B45B;--warn-soft:#33270F;--err:#F87171;--err-soft:#3F1B1B;--info:#B5BEC7;--info-soft:#1F2A34;
  --k0:#2DD4BF;--k0-soft:#123D39;--k1:#A5B4FC;--k1-soft:#24285A;--k2:#F9A8D4;--k2-soft:#4A1A33;--k3:#C4B5FD;--k3-soft:#33204F;
  --shadow:0 8px 24px rgba(0,0,0,.5);color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.6 var(--sans)}
a{color:inherit}
code{font:12.5px var(--mono);background:var(--panel-2);padding:1px 4px;border-radius:3px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr) 400px;grid-template-rows:48px minmax(0,1fr);height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .name{font:600 15px var(--sans);letter-spacing:.01em}
.top .counts{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.top .legend{display:flex;gap:10px;margin-left:auto;align-items:center;font-size:12px;color:var(--ink-2)}
.top button{font:500 12.5px var(--sans);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
.top button:hover{border-color:var(--line-2)}
.top button:focus-visible,.wl:focus-visible,.tree a:focus-visible{outline:2px solid var(--k0);outline-offset:2px}

.side{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px 12px 24px}
.side h3{font:500 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 4px 6px;display:flex;align-items:center;gap:6px}
.side h3 .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.tree ul{list-style:none;margin:0;padding-left:14px;border-left:1px solid var(--line)}
.tree>ul{padding-left:0;border:0}
.tree li{margin:1px 0}
.tree a,.plist a{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}
.tree a:hover,.plist a:hover{background:var(--panel-2)}
.tree a.on,.plist a.on{background:var(--on-soft);color:var(--on)}
.tree .n,.plist .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.multi{font-size:10px;color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;line-height:1.5;white-space:nowrap}
.plist{list-style:none;margin:0;padding:0}
.plist .n{color:var(--muted)}

.page{overflow:auto;padding:28px 44px 64px}
.page h1{font:600 26px/1.25 var(--serif);margin:0 0 6px;text-wrap:balance}
.page .meta{color:var(--muted);font-size:12.5px;margin:0 0 6px;max-width:80ch}
.page h2.sec{font:500 12.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:28px 0 10px;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.page p{max-width:68ch;margin:0 0 10px}
.page ul{max-width:76ch;padding-left:20px;margin:0 0 10px}
.page li{margin:2px 0}
.muted{color:var(--muted)}
.empty{font-size:13px}
.kids .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.tag{font:500 10.5px/1 var(--sans);letter-spacing:.04em;padding:3px 6px;border-radius:3px;text-transform:none;white-space:nowrap;cursor:help}
.tag-gen{background:var(--gen-soft);color:var(--gen)}
.tag-append{background:var(--append-soft);color:var(--append)}
.tag-store{background:var(--store-soft);color:var(--store)}
th .tag{margin-left:6px;vertical-align:1px}

.tblwrap{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:4px}
table.cmp{border-collapse:collapse;font-size:13px;min-width:100%}
.cmp th{text-align:left;font-weight:500;color:var(--ink-2);background:var(--panel-2);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:30ch}
.cmp tbody tr:last-child td{border-bottom:0}
.cmp td.rowhead{white-space:nowrap;font-weight:500}
.cmp td.na{color:var(--muted);text-align:center}
.cmp th.derived,.cmp td.derived{background:var(--gen-soft)}
.cmp td.derived{color:var(--ink-2)}
.cell{border-bottom:1px dotted var(--line-2);cursor:help}
.cell sup{font-size:9px;color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}
.wl{color:var(--k0);text-decoration:none;border-bottom:1px solid transparent}
.wl:hover{border-bottom-color:currentColor}
.rowhead .wl,.kids .wl,.mem-head .wl{color:var(--ink)}
.rowhead .wl:hover,.kids .wl:hover,.mem-head .wl:hover{color:var(--k0)}

.memberships{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin:0 0 6px}
.mem{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--panel)}
.mem-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:500}
.kind{font:500 10.5px/1 var(--sans);padding:3px 6px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
dl.cells{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:13px}
dl.cells dt{color:var(--muted);white-space:nowrap}
dl.cells dd{margin:0;min-width:0;overflow-wrap:anywhere}

.rail{overflow:hidden;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;font:500 12.5px var(--sans);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--k0)}
.tabs button:focus-visible{outline:2px solid var(--k0);outline-offset:-2px}
.pane{overflow:auto;flex:1;min-height:0}
pre.raw{margin:0;padding:14px 16px;font:12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
pre.raw .fm{color:var(--ink-2)}
pre.raw .gen{background:var(--gen-soft);display:block;border-left:3px solid var(--gen);padding-left:8px;margin-left:-11px}
.lint{list-style:none;margin:0;padding:0}
.lint li{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;font-size:13px;line-height:1.5}
.lint .sev{font:500 10.5px/1 var(--sans);letter-spacing:.04em;padding:4px 6px;border-radius:3px;align-self:start;margin-top:2px;white-space:nowrap}
.sev-warn{background:var(--warn-soft);color:var(--warn)}
.sev-err{background:var(--err-soft);color:var(--err)}
.sev-info{background:var(--info-soft);color:var(--info)}
.lint .where{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.lint .kindtag{font:500 11px var(--mono);color:var(--muted);margin-right:6px}
.lint-empty{padding:14px;color:var(--muted)}

#tip{position:fixed;z-index:50;max-width:min(44ch,70vw);padding:9px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow);font:italic 13px/1.5 var(--serif);pointer-events:none}
#tip b{font:500 11px var(--sans);letter-spacing:.04em;color:var(--muted);display:block;margin-bottom:3px;font-style:normal}

.schema h1{margin-bottom:12px}
.schema pre{margin:0;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font:12.5px/1.55 var(--mono);white-space:pre-wrap;max-width:80ch}
.schema p{max-width:68ch}

@media (max-width:1080px){
  .app{display:block;height:auto}
  .top{position:sticky;top:0;z-index:5}
  .side,.rail{border:0;border-bottom:1px solid var(--line)}
  .rail{max-height:60vh}
  .page{padding:22px 20px 40px}
}
@media (prefers-reduced-motion:no-preference){.tree a,.plist a{transition:background .12s}}
</style>

<div class="app">
  <header class="top">
    <span class="name">Quantization Wiki Pilot</span>
    <span class="counts" id="counts"></span>
    <div class="legend">
      <span class="tag tag-store" title="唯一的存储处">存</span>
      <span class="tag tag-gen" title="从 [存] 算出,不手改">生成</span>
      <span class="tag tag-append" title="人或 LLM 往后加,ingest 不覆盖">追加</span>
      <button id="btn-schema" type="button">schema.yaml</button>
    </div>
  </header>
  <nav class="side" id="side" aria-label="页面导航"></nav>
  <main class="page" id="page"></main>
  <aside class="rail">
    <div class="tabs" role="tablist">
      <button type="button" class="on" data-tab="raw" role="tab">原文件</button>
      <button type="button" data-tab="lint" role="tab">lint <span id="lint-n"></span></button>
    </div>
    <div class="pane" id="pane-raw"><pre class="raw" id="raw"></pre></div>
    <div class="pane" id="pane-lint" hidden><ul class="lint" id="lint"></ul></div>
  </aside>
</div>
<div id="tip" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  // One color for each kind, from the order of the schema; adding a kind does not require changing CSS
  var kindStyle = document.createElement('style');
  var css = '';
  D.nav.forEach(function(k, i){
    var v = '--k' + (i % 4);
    css += '.kind-' + k.kind + '{background:var(' + v + '-soft);color:var(' + v + ')}';
    css += '.tree[data-kind="' + k.kind + '"] a.on{--on:var(' + v + ');--on-soft:var(' + v + '-soft)}';
    css += '.sw-' + k.kind + '{background:var(' + v + ')}';
  });
  css += '.plist a.on{--on:var(--ink);--on-soft:var(--panel-2)}';
  kindStyle.textContent = css;
  document.head.appendChild(kindStyle);

  document.getElementById('counts').textContent =
    D.counts.papers + ' 篇论文 · ' + D.counts.aggs + ' 个聚合 · ' + D.counts.edges + ' 条边';

  // ----Navigation: One tree for each kind (DAG node will appear once under each parent node)----
  function treeHTML(id, depth){
    var pg = D.pages[id];
    var kids = D.children[id] || [];
    var par = D.parents[id] || [];
    var h = '<li><a href="#' + esc(id) + '" data-id="' + esc(id) + '">' + esc(pg.title)
      + (par.length > 1 ? ' <span class="multi" title="' + esc(par.join(', ')) + '">' + par.length + ' 父</span>' : '')
      + '<span class="n">' + (kids.length ? kids.length + ' 子' : pg.members + ' 篇') + '</span></a>';
    if (kids.length && depth < 8) h += '<ul>' + kids.map(function(k){ return treeHTML(k, depth + 1); }).join('') + '</ul>';
    return h + '</li>';
  }
  var side = '';
  D.nav.forEach(function(k){
    side += '<h3><span class="sw sw-' + k.kind + '"></span>' + esc(k.label) + ' <span class="muted">' + esc(k.dir) + '/</span></h3>';
    side += '<div class="tree" data-kind="' + k.kind + '"><ul>' + k.roots.map(function(r){ return treeHTML(r, 0); }).join('') + '</ul></div>';
  });
  side += '<h3>论文 <span class="muted">papers/</span></h3><ul class="plist">' + D.papers.map(function(p){
    var pg = D.pages[p];
    var edges = (pg.raw.match(/^  - in:/mg) || []).length;
    return '<li><a href="#' + esc(p) + '" data-id="' + esc(p) + '">' + esc(pg.short) + '<span class="n">' + edges + ' 边</span></a></li>';
  }).join('') + '</ul>';
  document.getElementById('side').innerHTML = side;

  // ---- lint ----
  var lintEl = document.getElementById('lint');
  var all = D.errors.map(function(e){ return {sev:'err', kind:'error', page:null, text:e}; }).concat(D.lint);
  document.getElementById('lint-n').textContent = all.length ? '(' + all.length + ')' : '';
  lintEl.innerHTML = all.length ? all.map(function(l){
    return '<li><span class="sev sev-' + l.sev + '">' + {warn:'警告',err:'错误',info:'说明'}[l.sev] + '</span><div>'
      + '<span class="kindtag">' + esc(l.kind) + '</span>' + esc(l.text)
      + (l.page ? '<a class="where wl" href="#' + esc(l.page) + '" data-id="' + esc(l.page) + '">' + esc(D.pages[l.page].title) + ' · ' + esc(l.page) + '</a>' : '')
      + '</div></li>';
  }).join('') : '<li class="lint-empty">没有发现。</li>';

  // ---- Original file: frontmatter faded, generated area highlighted ----
  function rawHTML(raw){
    var s = esc(raw);
    s = s.replace(/^(---\n[\s\S]*?\n---)/, '<span class="fm">$1</span>');
    s = s.replace(/(&lt;!-- generated:\w+ --&gt;\n)([\s\S]*?)(&lt;!-- \/generated --&gt;)/g, function(_, a, b, c){ return a + '<span class="gen">' + b + '</span>' + c; });
    return s;
  }

  // ---- Page ----
  var pageEl = document.getElementById('page'), rawEl = document.getElementById('raw');
  function show(id){
    if (id === 'schema') {
      pageEl.innerHTML = '<div class="schema"><h1>schema.yaml</h1><p>聚合有哪几种、每种的页长什么样、对照表哪些列是派生的、lint 的阈值——都在这里。加一种聚合是在这里加一段,导航树和页面跟着变。</p><pre>' + esc(D.schema) + '</pre></div>';
      rawEl.innerHTML = '<span class="fm">' + esc(D.schema) + '</span>';
    } else {
      var pg = D.pages[id];
      if (!pg) { id = home; pg = D.pages[id]; }
      pageEl.innerHTML = pg.html;
      rawEl.innerHTML = rawHTML(pg.raw);
      pageEl.scrollTop = 0;
    }
    document.querySelectorAll('.side a').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-id') === id); });
    document.title = (id === 'schema' ? 'schema.yaml' : D.pages[id].title) + ' · Quantization Wiki Pilot';
  }
  // Home page: the root node with the most descendants, not the first one in alphabetical order
  function size(id){ return 1 + (D.children[id] || []).reduce(function(n, k){ return n + size(k); }, 0); }
  var home = D.nav[0].roots.slice().sort(function(a, b){ return size(b) - size(a); })[0];
  function route(){ show(decodeURIComponent(location.hash.slice(1)) || home); }
  window.addEventListener('hashchange', route);
  document.getElementById('btn-schema').addEventListener('click', function(){ location.hash = 'schema'; });
  route();

  // ---- right column tab ----
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.toggle('on', x === b); });
      document.getElementById('pane-raw').hidden = b.dataset.tab !== 'raw';
      document.getElementById('pane-lint').hidden = b.dataset.tab !== 'lint';
    });
  });

  // ---- Anchor tip: Hover a grid to see the original text it refers to ----
  var tip = document.getElementById('tip');
  document.addEventListener('mouseover', function(e){
    var c = e.target.closest('.cell'); if (!c) return;
    tip.innerHTML = '<b>p.' + esc(c.dataset.page) + ' · 原文</b>“' + esc(c.dataset.quote) + '”';
    tip.hidden = false;
    var r = c.getBoundingClientRect();
    tip.style.left = Math.min(r.left, window.innerWidth - tip.offsetWidth - 12) + 'px';
    var top = r.bottom + 8;
    if (top + tip.offsetHeight > window.innerHeight) top = r.top - tip.offsetHeight - 8;
    tip.style.top = Math.max(8, top) + 'px';
  });
  document.addEventListener('mouseout', function(e){ if (e.target.closest && e.target.closest('.cell')) tip.hidden = true; });
})();
</script>
