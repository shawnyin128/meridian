[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.0.2"
description = "Markdown-first LLM-maintained paper wiki with CLI and MCP entries."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Used by scripts/brand-assets.py to generate icons from design sources; not needed at runtime or in tests.
brand = [
  "Pillow>=10.0",
]

[project.scripts]
meridian = "meridian.cli:main"
meridian-mcp = "meridian.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meridian = [
  "templates/research-dev/**/*.md",
]
